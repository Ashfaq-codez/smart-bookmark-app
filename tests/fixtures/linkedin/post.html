owers Majorana 1, the first quantum processing unit built on a topological core.\n\nWe believe this breakthrough will allow us to create a truly meaningful quantum computer not in decades, as some have predicted, but in years. \n\nThe qubits created with topoconductors are faster, more reliable, and smaller. \n\nThey are 1/100th of a millimeter, meaning we now have a clear path to a million-qubit processor. \n\nImagine a chip that can fit in the palm of your hand yet is capable of solving problems that even all the computers on Earth today combined could not! \n\nSometimes researchers have to work on things for decades to make progress possible.\n\nIt takes patience and persistence to have big impact in the world. \n\nAnd I am glad we get the opportunity to do just that at Microsoft. \n\nThis is our focus: When productivity rises, economies grow faster, benefiting every sector and every corner of the globe. \n\nIt’s not about hyping tech; it’s about building technology that truly serves the world. \n\nRead more about our discovery, and why it matters, here: https://aka.ms/AAu76rr", "author": {"name": "Satya Nadella", "image": {"url": "https://media.licdn.com/dms/image/v2/C5603AQHHUuOSlRVA1w/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1579726625398?e=2147483647&v=beta&t=Rr7WT9uBM0byOij0oT_KirejIMVE4HK4r8NGIp0zjdI", "@type": "ImageObject"}, "url": "https://www.linkedin.com/in/satyanadella", "@type": "Person", "interactionStatistic": {"@type": "InteractionCounter", "interactionType": "http://schema.org/FollowAction", "userInteractionCount": 12227183}}, "interactionStatistic": [{"@type": "InteractionCounter", "interactionType": "http://schema.org/LikeAction", "userInteractionCount": 127815}, {"@type": "InteractionCounter", "interactionType": "https://schema.org/CommentAction", "userInteractionCount": 3609}], "hasPart": {"@type": "WebPageElement", "isAccessibleForFree": false, "cssSelector": ".details"}}</script>
