<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>inntoit</title>
  <style>
    :root {
      --bg: #FAF9F5;
      --card: #FFFFFF;
      --ink: #171A17;
      --muted: #737B73;
      --line: rgba(0, 0, 0, 0.07);
      --field: #F4F1EA;
      --brand: #4D6A51;
      --brand-ink: #FFFFFF;
      --brand-soft: #E8EFE5;
      --warn-bg: #FDF6E3;
      --warn-ink: #6B4E16;
      --warn-line: rgba(217, 119, 6, 0.22);
      --info-bg: #FEF3C7;
      --info-ink: #92400E;
      --err-bg: #FEE2E2;
      --err-ink: #991B1B;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F120F;
        --card: #1A1D1A;
        --ink: #ECEDEA;
        --muted: #9AA39A;
        --line: rgba(255, 255, 255, 0.07);
        --field: #232723;
        --brand: #7FA184;
        --brand-ink: #0F120F;
        --brand-soft: #1F2A20;
        --warn-bg: #2B2414;
        --warn-ink: #F2D69B;
        --warn-line: rgba(217, 119, 6, 0.32);
        --info-bg: #2B2414;
        --info-ink: #F2D69B;
        --err-bg: #2D1717;
        --err-ink: #F5B4B4;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      padding: 14px;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- header ---------- */
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand img { width: 22px; height: 22px; border-radius: 6px; }
    .brand span { font: 500 19px/1 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 9px; border: none; cursor: pointer;
      background: transparent; color: var(--muted); transition: background .15s ease, color .15s ease;
    }
    .icon-btn:hover { background: var(--field); color: var(--ink); }
    .icon-btn:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

    /* ---------- card ---------- */
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
      animation: rise .22s ease-out both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .page { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .fav {
      width: 34px; height: 34px; border-radius: 10px; background: var(--field);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; color: var(--muted);
    }
    .fav img { width: 18px; height: 18px; }
    .page-text { min-width: 0; flex: 1; }
    .page-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-sub { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; min-width: 0; }
    .page-sub .domain { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
      padding: 1px 7px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 10.5px; font-weight: 600;
    }
    .chip[hidden] { display: none; }

    /* ---------- warning (feed / non-post page) ---------- */
    .notice {
      display: flex; gap: 10px; padding: 10px 11px; border-radius: 12px;
      background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line);
    }
    .notice[hidden] { display: none; }
    .notice svg.i { margin-top: 1px; }
    .notice b { display: block; font-size: 12.5px; margin-bottom: 2px; }
    .notice p { font-size: 12px; line-height: 1.45; }
    .steps { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 11.5px; font-weight: 600; flex-wrap: wrap; }
    .kbd { padding: 1px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.06); }
    @media (prefers-color-scheme: dark) { .kbd { background: rgba(255, 255, 255, 0.08); } }

    /* ---------- note ---------- */
    .note[hidden] { display: none; }
    textarea {
      width: 100%; min-height: 72px; max-height: 180px; padding: 9px 11px; resize: none;
      font: 13px/1.5 Georgia, serif; color: var(--ink); background: var(--field);
      border: 1px solid transparent; border-radius: 11px; outline: none; transition: border-color .15s ease, background .15s ease;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    textarea::-webkit-scrollbar { width: 6px; }
    textarea::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
    textarea::placeholder { color: var(--muted); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    textarea:focus { border-color: var(--brand); background: var(--card); }
    .hint { display: flex; justify-content: flex-end; color: var(--muted); font-size: 10.5px; margin-top: 4px; }

    /* ---------- save button ---------- */
    .save {
      width: 100%; height: 40px; border: none; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      background: var(--brand); color: var(--brand-ink); font: 600 13px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      transition: transform .12s ease, opacity .15s ease, background .2s ease;
    }
    .save:hover:not(:disabled) { opacity: .92; }
    .save:active:not(:disabled) { transform: scale(.985); }
    .save:disabled { cursor: default; }
    .save[hidden] { display: none; }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- status ---------- */
    .status {
      display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 11px; font-size: 12.5px; font-weight: 500;
      animation: rise .18s ease-out both;
    }
    .status[hidden] { display: none; }
    .status.ok { background: var(--brand-soft); color: var(--brand); }
    .status.dup { background: var(--info-bg); color: var(--info-ink); }
    .status.err { background: var(--err-bg); color: var(--err-ink); }
    .status button {
      margin-left: auto; border: none; background: none; color: inherit; font: 700 12px/1 inherit;
      text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="brand"><img src="icon-32.png" alt="" /><span>inntoit</span></div>
    <button class="icon-btn" id="open-app" title="Open inntoit" aria-label="Open inntoit">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
  </div>

  <div class="card">
    <div class="page">
      <div class="fav" id="fav">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </div>
      <div class="page-text">
        <div class="page-title" id="page-title">Reading this tab…</div>
        <div class="page-sub"><span class="chip" id="site-chip" hidden></span><span class="domain" id="page-domain"></span></div>
      </div>
    </div>

    <div class="notice" id="notice" role="status" hidden>
      <svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div>
        <b id="notice-title"></b>
        <p id="notice-text"></p>
        <div class="steps">
          <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M14 4.1 12 6"/><path d="m5.1 8-2.9-.8"/><path d="m6 12-1.9 2"/><path d="M7.2 2.2 8 5.1"/><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/></svg>
          <span>Right-click a post</span><span>→</span><span class="kbd">Save inntoit</span>
        </div>
      </div>
    </div>

    <div class="note" id="note">
      <textarea id="note-input" placeholder="Add a note or thought (optional)…" aria-label="Note"></textarea>
      <div class="hint" id="kbd-hint"></div>
    </div>

    <button class="save" id="save-btn"></button>
    <div class="status" id="status" role="status" hidden></div>
  </div>

  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
