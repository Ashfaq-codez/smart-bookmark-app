<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #FAF9F5;
      color: #171A17;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-family: Georgia, serif;
      font-size: 19px;
      font-weight: 500;
      color: #171A17;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .url-badge {
      font-size: 11px;
      color: #737B73;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: #F4F1EA;
      padding: 7px 10px;
      border-radius: 8px;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      font-size: 13px;
      font-family: Georgia, serif;
      color: #171A17;
      background: #FAF9F5;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      outline: none;
      resize: none;
      line-height: 1.5;
    }
    textarea:focus {
      border-color: #4D6A51;
    }
    textarea::placeholder {
      color: #A0A6A0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button {
      width: 100%;
      padding: 11px;
      font-size: 13px;
      font-weight: 500;
      background-color: #4D6A51;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      display: none;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">inntoit</span>
  </div>
  <div class="card">
    <div class="url-badge" id="tab-url">Detecting tab...</div>
    <textarea id="note-input" placeholder="Add a personal note or reflection..."></textarea>
    <button id="save-btn">Save inntoit</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
