<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #fef9c3; /* yellow-100 */
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #ffffff;
      border: 3px solid #111827;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 4px 4px 0px #111827;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: #111827;
    }
    p {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      word-break: break-all;
      max-height: 36px;
      overflow: hidden;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: #fde047; /* yellow-300 */
      color: #111827;
      border: 2px solid #111827;
      border-radius: 8px;
      box-shadow: 3px 3px 0px #111827;
      cursor: pointer;
      transition: transform 0.05s, box-shadow 0.05s;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #111827;
    }
    #status {
      display: none;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      border: 2px solid #111827;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Smart Hub</h2>
    <p id="tab-url">Detecting tab...</p>
    <button id="save-btn">Save Tab</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
